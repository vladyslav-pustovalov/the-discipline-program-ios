name: Regression UI Tests

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to run tests on'
        required: true
        default: 'develop'
      device:
        description: 'iOS Simulator Device (e.g. iPhone 16 Pro, iPhone 18 Pro)'
        required: true
        default: 'iPhone 18 Pro'
      os:
        description: 'iOS Version'
        required: true
        default: 'latest'

jobs:
  regression-ui-tests:
    name: Run UI Tests (Regression)
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Clean Previous Build Artifacts
        run: |
          rm -rf TestResults.xcresult
          rm -rf DerivedData

      - name: Run Xcode UI Tests
        run: |
          DEVICE_NAME="${{ inputs.device }}"
          SIM_UDID=$(xcrun simctl list devices | grep -E "${DEVICE_NAME} \([0-9A-F-]+\)" | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}' | head -n 1)

          if [ -z "$SIM_UDID" ]; then
            SIM_UDID=$(xcrun simctl list devices | grep -F "${DEVICE_NAME}" | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}' | head -n 1)
          fi

          if [ -z "$SIM_UDID" ]; then
            echo "Error: Could not find any iOS Simulator matching device name '${DEVICE_NAME}'"
            exit 1
          fi

          echo "Resolved Simulator UDID: $SIM_UDID for device '${DEVICE_NAME}'"

          xcodebuild test \
            -project TheDisciplineProgram.xcodeproj \
            -scheme TheDisciplineProgramRegressionUITests \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -resultBundlePath TestResults.xcresult \
            -derivedDataPath DerivedData

      - name: Report Test Results Summary
        uses: kishikawakatsumi/xcresulttool@v1
        if: always()
        with:
          path: TestResults.xcresult
          title: "Regression UI Test Report"

      - name: Upload Test Results (.xcresult)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-ui-test-results-${{ github.run_id }}
          path: TestResults.xcresult
          retention-days: 14

      - name: Clean Up Self-Hosted Runner Files
        if: always()
        run: |
          echo "Cleaning up local test bundle and derived data..."
          rm -rf TestResults.xcresult
          rm -rf DerivedData
